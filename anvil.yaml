       "mainEntity": [
        {
         "@type": "Question",
         "name": "How exactly do you use AI?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "AI tools help us draft code, tests, data migrations and documentation, and explore alternatives quickly. An engineer directs that work, reviews every change line by line, runs the tests and checks security before anything reaches you. AI makes us faster. It never makes the decisions."
         }
        },
        {
         "@type": "Question",
         "name": "What does “you pay for results” mean?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Each request gets a fixed price before work starts. When it's ready, you test it on a staging version. If it meets the acceptance criteria you agreed to, you accept it and we invoice. If not, we fix it at no extra cost. There are no timesheets."
         }
        },
        {
         "@type": "Question",
         "name": "What kinds of apps can you build?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Business software with real operational weight: admin panels and back-offices, client portals, configurable SaaS, APIs and integrations, data pipelines and reporting, mobile-first web apps, and even games. If it needs logins, roles, data and an admin side, it's our specialty."
         }
        },
        {
         "@type": "Question",
         "name": "Do I own the code?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. You own the code, the data and the accounts from day one. We can host and maintain the app for you, or hand everything over to your team or your infrastructure."
         }
        },
        {
         "@type": "Question",
         "name": "How fast can you deliver?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Most feature requests get a fixed quote within two business days and ship within one to three weeks. New products are planned in milestones, and the first usable version typically lands in four to eight weeks."
         }
        },
        {
         "@type": "Question",
         "name": "Can you take over an existing app?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Often, yes. We start with a short, fixed-price audit of the codebase, document the risks, then quote improvements request by request, like any other work."
         }
        },
        {
         "@type": "Question",
         "name": "Do you only work with Montréal companies?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. We're based in Montréal and happy to meet in person locally, but we work with clients across Canada, the United States and Europe. Service is available in English and French."
         }
        },
        {
         "@type": "Question",
         "name": "Is my data safe?",
         "acceptedAnswer": {
          "@type": "Answer",
          "text": "Workspaces are private, connections are encrypted and access follows least privilege. Apps are built with Québec's Law 25 and PIPEDA in mind, and we can host in Canada when required."
