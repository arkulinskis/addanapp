    <script>
    /* Language: English is built in. Only if the visitor picked another language (client_code/i18n.py)
       start downloading its pack now, in parallel with the app. Bump ?v= together with i18n.VERSION. */
    (function () {
      var l = null;
      try { l = localStorage.getItem('aa.lang'); } catch (e) {}
      if (l === 'fr' || l === 'ru' || l === 'lv') {
        document.documentElement.lang = l;
        window.aaLangPack = fetch('_/theme/lang-' + l + '.json?v=2').then(function (r) {
          if (!r.ok) throw new Error('lang ' + r.status);
          return r.text();
        });
        window.aaLangPack.catch(function () {});
        if (l === 'ru') {
          var f = document.createElement('link');
          f.rel = 'stylesheet';
          f.href = 'https://fonts.googleapis.com/css2?family=PT+Serif:ital@0;1&display=swap';
          document.head.appendChild(f);
        }
      } else {
        document.documentElement.lang = 'en';
      }
    })();
    </script>
