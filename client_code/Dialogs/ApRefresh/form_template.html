<div class="dlg">
  <h3 class="dlg-h"><anvil-component type="Label" name="heading" prop:role='["t"]'></anvil-component></h3>
  <div class="muted small"><anvil-component type="Label" name="intro" prop:role='["t"]'></anvil-component></div>
  <div class="ap-refresh-list"><anvil-component type="LinearPanel" name="boxes"></anvil-component></div>
  <div class="small"><anvil-component type="Button" name="all_button" prop:text="Tick all" prop:role='["aa-link"]'></anvil-component> · <anvil-component type="Button" name="none_button" prop:text="Untick all" prop:role='["aa-link"]'></anvil-component></div>
  <anvil-component type="Label" name="error" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="dlg-acts">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["aa-btn", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="ok_button" prop:text="Refresh" prop:role='["aa-btn", "accent", "ic-refresh"]'></anvil-component>
  </div>
</div>
