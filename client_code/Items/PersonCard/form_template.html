<div class="person">
  <div class="top"><anvil-component type="Addanapp.Components.Avatar" name="avatar" prop:size="44"></anvil-component><div style="min-width:0"><b anvil:dom-node="name"></b>
    <div class="s"><x-t anvil:dom-node="company"></x-t><a anvil:dom-node="email"></a></div></div></div>
  <div class="chips">
    <anvil-component type="Label" name="c_consultant"></anvil-component>
    <anvil-component type="Label" name="c_demo"></anvil-component>
    <anvil-component type="Label" name="c_disabled"></anvil-component>
    <anvil-component type="Label" name="c_seen"></anvil-component>
  </div>
  <div class="stats"><div><b anvil:dom-node="open"></b><x-t data-t>open</x-t></div><div><b anvil:dom-node="delivered"></b><x-t data-t>delivered</x-t></div><div><b anvil:dom-node="value"></b><x-t data-t>accepted value</x-t></div></div>
  <div class="acts">
    <anvil-component type="Button" name="request_button" prop:text="Request" prop:role='["aa-btn", "sm", "ic-plus"]'></anvil-component>
    <anvil-component type="Button" name="view_button" prop:text="View requests" prop:role='["aa-btn", "sm", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="role_button" prop:role='["aa-btn", "sm", "ghost"]'></anvil-component>
    <anvil-component type="Button" name="enable_button" prop:role='["aa-btn", "sm"]'></anvil-component>
  </div>
</div>
