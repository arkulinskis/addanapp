<article class="ap-card" anvil:dom-node="card">
  <img class="hero" anvil:dom-node="hero" alt="" loading="lazy">
  <div class="top"><span class="ap-dot" anvil:dom-node="dot" role="img"></span><a class="name" anvil:dom-node="name"></a><span class="age" anvil:dom-node="age"></span>
    <button type="button" class="ap-ref" anvil:dom-node="ref" anvil:on-dom:click="self.ref_click"><i class="ic ic-refresh" aria-hidden="true"></i></button></div>
  <div class="desc" anvil:dom-node="desc"></div>
  <div class="ap-segs" anvil:dom-node="segs" aria-hidden="true"></div>
  <div class="next" anvil:dom-node="next"></div>
  <div class="ap-links" anvil:dom-node="links"></div>
  <div class="ap-chips" anvil:dom-node="chips"></div>
</article>
