<details class="pf-item" anvil:dom-node="item" anvil:on-dom:toggle="self.toggled">
  <summary class="pf-row">
    <span class="pic" aria-hidden="true" anvil:dom-node="pic"></span>
    <span class="nm"><b anvil:dom-node="name"></b><span class="new" anvil:name="new_badge" data-t>New</span></span>
    <span class="ln" anvil:dom-node="line"></span>
    <span class="tg" anvil:dom-node="tags"></span>
    <span class="dm" anvil:dom-node="dm"></span>
    <span class="go plus" aria-hidden="true"></span>
  </summary>
  <anvil-component type="LinearPanel" name="body_holder" prop:role='["contents"]'></anvil-component>
</details>
