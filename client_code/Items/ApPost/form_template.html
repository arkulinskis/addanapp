<article class="ap-post" anvil:dom-node="art">
  <header><b anvil:dom-node="label"></b><span class="angle" anvil:dom-node="angle"></span>
    <button type="button" class="aa-btn sm ghost" anvil:dom-node="copy" anvil:on-dom:click="self.copy_click">Copy</button>
    <label class="ap-chk"><input type="checkbox" anvil:dom-node="tick" anvil:on-dom:change="self.tick_change"><span anvil:dom-node="tick_lbl"></span></label></header>
  <details anvil:dom-node="fold"><summary anvil:dom-node="summary"></summary><div class="text" anvil:dom-node="text_in"></div></details>
  <div class="text" anvil:dom-node="text"></div>
  <div class="note" anvil:dom-node="note"></div>
</article>
